name: Compilar APKs de Russell

on:
  workflow_dispatch:

jobs:
  build-paciente:
    name: Compilar App Paciente
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aceptar licencias de Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Flet CLI
        run: pip install -U "flet[all]"

      - name: Compilar APK Paciente
        working-directory: ./appPaciente
        run: flet build apk --product "Russell" --project "russell_paciente" --org "com.russell.paciente" -v --yes

      - name: Subir APK Paciente
        uses: actions/upload-artifact@v4
        with:
          name: Russell-Paciente-APK
          path: appPaciente/build/**/*.apk

  build-cuidador:
    name: Compilar App Cuidador
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Aceptar licencias de Android
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Instalar Flet CLI
        run: pip install -U "flet[all]"

      - name: Compilar APK Cuidador
        working-directory: ./appCuidador
        run: flet build apk --product "Russell para cuidadores" --project "russell_cuidador" --org "com.russell.cuidador" -v --yes

      - name: Subir APK Cuidador
        uses: actions/upload-artifact@v4
        with:
          name: Russell-Cuidador-APK
          path: appCuidador/build/**/*.apk
