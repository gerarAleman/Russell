name: Compilar APKs de Russell

on:
  workflow_dispatch:

jobs:
  build-paciente:
    name: Compilar App Paciente
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: pip install flet

      - name: Compilar APK Paciente
        # NOTA: Asegúrate de que coincida con el nombre exacto de tu carpeta (ej: appPaciente)
        working-directory: ./appPaciente
        run: flet build apk --project-name "RussellPaciente" --org "com.russell.paciente"

      - name: Subir APK Paciente
        uses: actions/upload-artifact@v4
        with:
          name: Russell-Paciente-APK
          path: appPaciente/build/apk/*.apk

  build-cuidador:
    name: Compilar App Cuidador
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar Flet
        run: pip install flet

      - name: Compilar APK Cuidador
        # NOTA: Asegúrate de que coincida con el nombre exacto de tu carpeta (ej: appCuidador)
        working-directory: ./appCuidador
        run: flet build apk --project-name "RussellCuidador" --org "com.russell.cuidador"

      - name: Subir APK Cuidador
        uses: actions/upload-artifact@v4
        with:
          name: Russell-Cuidador-APK
          path: appCuidador/build/apk/*.apk
